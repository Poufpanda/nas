networks:
  proxy-network:
    name: proxy-network

services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: "unless-stopped"
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: "unless-stopped"
    volumes:
      - /home/pouf/jellyfin/config:/config
      - /home/pouf/jellyfin/cache:/cache
      - /home/pouf/media:/media
    networks:
      - proxy-network

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: "unless-stopped"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - /home/pouf/qbittorrent/config:/config
      - /home/pouf/media:/media
    ports:
      - 6881:6881
      - 6881:6881/udp
    networks:
      - proxy-network

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: "unless-stopped"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /home/pouf/radarr/config:/config
      - /home/pouf/media:/media
    networks:
      - proxy-network

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: "unless-stopped"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /home/pouf/prowlarr/config:/config
    networks:
      - proxy-network

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: "unless-stopped"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /home/pouf/sonarr/config:/config
      - /home/pouf/media:/media
    networks:
      - proxy-network
